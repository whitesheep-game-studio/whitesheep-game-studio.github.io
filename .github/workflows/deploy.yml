name: Build, test and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: whitesheep-game-studio/whitesheep-game-studio-public/.github/workflows/reusable-web.yml@40495fa780909293e8e8f25b9d93263d33e056d3
    with:
      automation-ref: 40495fa780909293e8e8f25b9d93263d33e056d3
      config: .ci/project.yml

  # Keep the existing required check while verification runs in a reusable job.
  verify:
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every quality stage to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: '[[ "$QUALITY_RESULT" == success ]]'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the site that passed verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-static-site
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
          retention-days: 3
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
