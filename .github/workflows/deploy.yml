name: Build, test and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: whitesheep-game-studio/whitesheep-game-studio-public/.github/workflows/reusable-web.yml@72421e4b3c0960d98afb89535ea0235f7f757670
    with:
      automation-ref: 72421e4b3c0960d98afb89535ea0235f7f757670
      config: .ci/project.yml

  # Keep the existing required check while verification runs in a reusable job.
  verify:
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every quality stage to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: '[[ "$QUALITY_RESULT" == success ]]'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the site that passed verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-static-site
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
          retention-days: 3
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
