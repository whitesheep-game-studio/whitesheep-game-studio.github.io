name: Build, test and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate static website
        run: python build.py
      - name: Validate links and page contract
        run: python check_site.py
      - name: Test generated asset integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lint JavaScript
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Validate HTML
        run: npm run html:check
      - name: Vitest
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright and axe-core
        run: npm run test:e2e
      - name: Lighthouse CI
        run: npm run lighthouse
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
