<article class="doc"><p class="eyebrow">Sources &amp; credits</p><h1>출처와 이용 조건</h1><p>이 페이지는 앱이 가리키는 출처와 이용 조건 안내입니다.</p><h2>비공식 앱</h2><p>이 앱은 어떤 시험 주관·시행 기관과도 무관한 비공식 학습 앱이며 합격을 보장하지 않습니다.</p><h2>콘텐츠의 출처</h2><p>개념 카드와 용어집은 표준 미시·거시경제학, 재정학 및 일반경영학(조직·전략·경영과학) 교육과정을 참고해 운영자가 자체 편집한 내용입니다. 기출문제의 본문은 앱에 담지 않고 연도와 문항 번호로만 안내합니다.</p><h2>오류 제보</h2><p>틀린 곳은 문의 메일로 알려 주세요.</p></article>
